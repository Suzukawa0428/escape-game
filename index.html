<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>国家情報統合解析局</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

min-height:100vh;

background:
linear-gradient(
rgba(0,0,0,0.75),
rgba(0,0,0,0.85)
),
url("AI_Hayato.png");

background-size:cover;
background-position:center;
background-repeat:no-repeat;

font-family:"Yu Gothic",sans-serif;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

color:white;

}

/* 電脳グリッド */

body::before{

content:"";

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

background:

repeating-linear-gradient(
90deg,
rgba(0,255,255,0.05) 0px,
rgba(0,255,255,0.05) 1px,
transparent 1px,
transparent 60px
),

repeating-linear-gradient(
0deg,
rgba(0,255,255,0.05) 0px,
rgba(0,255,255,0.05) 1px,
transparent 1px,
transparent 60px
);

animation:gridMove 15s linear infinite;

pointer-events:none;

}

/* 光る円 */

body::after{

content:"";

position:absolute;

width:500px;
height:500px;

border-radius:50%;

border:2px solid rgba(0,255,255,0.2);

box-shadow:
0 0 50px rgba(0,255,255,0.2);

animation:rotateCircle 25s linear infinite;

}

@keyframes rotateCircle{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}

@keyframes gridMove{

from{
transform:translateY(0px);
}

to{
transform:translateY(60px);
}

}

.card{

position:relative;
z-index:10;

width:650px;
max-width:90%;

padding:40px;

background:rgba(0,0,0,0.58);

backdrop-filter:blur(12px);

border-radius:20px;

border:1px solid rgba(0,255,255,0.25);

box-shadow:
0 0 20px rgba(0,255,255,0.25),
0 0 60px rgba(0,120,255,0.25);

text-align:center;

}

h1{

font-size:42px;

margin-bottom:15px;

color:#4fdfff;

letter-spacing:5px;

text-shadow:
0 0 10px #4fdfff,
0 0 20px #4fdfff,
0 0 40px #4fdfff;

}

.subtitle{

line-height:1.8;

font-size:18px;

color:#dddddd;

margin-bottom:30px;

}

input{

width:260px;

padding:14px;

background:#061321;

color:white;

border:1px solid #4fdfff;

border-radius:10px;

font-size:22px;

text-align:center;

outline:none;

}

input:focus{

box-shadow:
0 0 10px #4fdfff;

}

button{

margin-top:20px;

padding:12px 35px;

font-size:20px;

background:#0099ff;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

transition:0.3s;

}

button:hover{

transform:scale(1.05);

box-shadow:
0 0 20px #00ccff;

}

#message{

margin-top:30px;

font-size:22px;

line-height:2;

}

.progress{

color:#90ee90;

font-size:22px;

}

.access{

font-size:30px;

font-weight:bold;

color:#00ff88;

text-shadow:
0 0 10px #00ff88,
0 0 20px #00ff88;

margin-bottom:20px;

}

.keyword{

font-size:100px;

font-weight:bold;

color:#00ffff;

text-shadow:
0 0 15px #00ffff,
0 0 30px #00ffff,
0 0 60px #00ffff;

animation:flash 1s infinite alternate;

}

@keyframes flash{

from{
opacity:.5;
}

to{
opacity:1;
}

}

</style>

</head>

<body>

<div class="card">

<h1>国家情報統合解析局</h1>

<div class="subtitle">

AIハヤトより緊急通信

<br><br>

暗号化された機密情報を発見

<br>

認証コードを入力し、

情報の復元を開始してください

</div>

<input
id="pw"
placeholder="認証コード">

<br>

<button onclick="checkPassword()">
認証する
</button>

<div id="message"></div>

</div>

<script>

const keywordMap={

"1":"A",
"2":"B",
"3":"C",
"4":"D",
"5":"E",
"6":"F",
"7":"G",
"8":"H"

};

function checkPassword(){

const pw=document.getElementById("pw").value;

if(keywordMap[pw]){

startLoading(keywordMap[pw]);

}else{

document.getElementById("message").innerHTML=
`
<div style="color:#ff6666;">
万死に値します。
</div>
`;

}

}

function startLoading(keyword){

let p=0;

const stages=[
"衛星リンク接続",
"通信路確保",
"暗号解析中",
"情報復元処理開始"
];

document.getElementById("message").innerHTML=
`
<div class="progress">

衛星リンク接続

<br><br>

□□□□□□□□□□ 0%

</div>
`;

const timer=setInterval(function(){

p+=10;

let stage=
stages[
Math.min(
Math.floor(p/30),
3
)
];

let bar=
"■".repeat(p/10)
+
"□".repeat(10-p/10);

document.getElementById("message").innerHTML=
`
<div class="progress">

${stage}

<br><br>

${bar} ${p}%

</div>
`;

if(p>=100){

clearInterval(timer);

document.getElementById("message").innerHTML=
`
<div class="access">

✅ ACCESS GRANTED

</div>

<div style="color:#90ee90;">

機密情報へのアクセスを許可

<br><br>

解析レベル：S

<br>

情報提供者：AIハヤト

<br><br>

謎を見つけるための手掛かりは...

<br><br>

<div class="keyword">

${keyword}

</div>

</div>
`;

}

},250);

}

</script>

</body>
</html>
