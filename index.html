<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<title>極秘情報解析システム</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;

background:
radial-gradient(circle at top,#123a78,#050914 70%);

font-family:"Yu Gothic",sans-serif;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;
color:white;
}

/* 電脳グリッド */

body::before{

content:"";

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

background:

repeating-linear-gradient(
90deg,
rgba(0,255,255,0.07) 0px,
rgba(0,255,255,0.07) 1px,
transparent 1px,
transparent 50px
),

repeating-linear-gradient(
0deg,
rgba(0,255,255,0.05) 0px,
rgba(0,255,255,0.05) 1px,
transparent 1px,
transparent 50px
);

animation:gridMove 12s linear infinite;

pointer-events:none;
}

@keyframes gridMove{

0%{
transform:translateY(0px);
}

100%{
transform:translateY(50px);
}

}

.card{

position:relative;
z-index:5;

width:650px;
max-width:92%;

padding:40px;

background:rgba(0,0,0,0.45);

backdrop-filter:blur(12px);

border:1px solid rgba(0,255,255,0.3);

border-radius:20px;

text-align:center;

box-shadow:
0 0 20px #00ffff55,
0 0 60px #0088ff33;

}

/* AIハヤト代替ホログラム */

.ai{

width:140px;
height:140px;

margin:auto;

border-radius:50%;

border:3px solid #4fdfff;

display:flex;
justify-content:center;
align-items:center;

font-size:70px;

background:
radial-gradient(circle,#4fdfff33,#001b33);

box-shadow:
0 0 20px #4fdfff,
0 0 50px #4fdfff;

animation:pulse 2s infinite;
}

@keyframes pulse{

0%{
transform:scale(1);
opacity:.8;
}

50%{
transform:scale(1.05);
opacity:1;
}

100%{
transform:scale(1);
opacity:.8;
}

}

h1{

color:#4fdfff;

letter-spacing:4px;

text-shadow:
0 0 10px #4fdfff,
0 0 20px #4fdfff;

}

.subtitle{

line-height:1.8;
color:#ddd;

margin-bottom:25px;

}

input{

width:250px;

padding:13px;

font-size:22px;

text-align:center;

background:#071423;

border:1px solid #4fdfff;

color:white;

border-radius:10px;

}

button{

margin-top:15px;

padding:13px 35px;

font-size:20px;

border:none;

border-radius:10px;

background:#00a9ff;

color:white;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.05);

box-shadow:0 0 20px #00ccff;

}

#message{

margin-top:30px;

font-size:22px;

line-height:1.8;

}

.progress{

color:#90ee90;

font-size:22px;

}

.keyword{

font-size:90px;

font-weight:bold;

color:#ffd700;

text-shadow:
0 0 20px #ffd700,
0 0 40px #ffd700,
0 0 60px #ffd700;

animation:flash 1s infinite alternate;

}

@keyframes flash{

from{
opacity:.5;
}

to{
opacity:1;
}

}

.access{

font-size:26px;

color:#00ff88;

font-weight:bold;

margin-bottom:20px;

}

</style>

</head>

<body>

<div class="card">

<div class="ai">
🤖
</div>

<h1>極秘情報解析システム</h1>

<div class="subtitle">

AIハヤトより緊急通信

<br><br>

国家機密ファイルが暗号化されています。

<br>

認証コードを入力し、
極秘データを復元してください。

</div>

<input
id="pw"
placeholder="認証コード">

<br>

<button onclick="checkPassword()">
認証する
</button>

<div id="message"></div>

</div>

<script>

const keywordMap = {

"1":"A",
"2":"B",
"3":"C",
"4":"D",
"5":"E",
"6":"F",
"7":"G",
"8":"H"

};

function checkPassword(){

const pw =
document.getElementById("pw").value;

if(keywordMap[pw]){

startLoading(keywordMap[pw]);

}else{

document.getElementById("message").innerHTML=
`
<div style="color:#ff6666;">
万死に値します。
</div>
`;

}

}

function startLoading(keyword){

let p=0;

document.getElementById("message").innerHTML=

`
<div class="progress">

情報を復元中...

<br><br>

□□□□□□□□□□ 0%

</div>
`;

let timer = setInterval(function(){

p += 10;

let bar =
"■".repeat(p/10)
+
"□".repeat(10-p/10);

document.getElementById("message").innerHTML=

`
<div class="progress">

情報を復元中...

<br><br>

${bar} ${p}%

</div>
`;

if(p>=100){

clearInterval(timer);

document.getElementById("message").innerHTML=

`
<div class="access">

✅ ACCESS GRANTED

</div>

<div style="color:#90ee90">

機密ファイルの復元に成功しました

<br><br>

ハヤトからの手紙

<br><br>

謎を見つけるための手掛かりは…

<br><br>

<div class="keyword">
${keyword}
</div>

</div>
`;

}

},250);

}

</script>

</body>
</html>
